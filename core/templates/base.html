<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Django Block for dynamic titles -->
    <title>{% block title %}Dashboard{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Optional: Bootstrap Icons (Great for sidebars) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* Ensures the sidebar takes full screen height and stays sticky */
        .sidebar {
            min-height: 100vh;
            width: 280px;
            position: sticky;
            top: 0;
        }
        /* Make sure the main layout covers the whole screen */
        .wrapper {
            min-height: 100vh;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Wrapper for Sidebar and Main Content -->
    <div class="d-flex wrapper">
        
        <!-- Sidebar -->
        <div class="d-flex flex-column flex-shrink-0 p-3 text-bg-dark sidebar shadow">
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <i class="bi bi-box-seam me-2 fs-4"></i>
                <span class="fs-4 fw-semibold">My App</span>
            </a>
            <hr>
            
            <ul class="nav nav-pills flex-column mb-auto">
                <li>
                    <!-- User Record Attribute -->
                    <a href="{% url 'home' %}" class="nav-link active" aria-current="page">
                        <i class="bi bi-person-lines-fill me-2"></i>
                        User Record
                    </a>
                </li>
            </ul>
            
            <hr>
            
            <!-- Sidebar Bottom Profile / Logout -->
            <div class="dropdown">
                <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle me-2 fs-5"></i>
                    <strong>Account</strong>
                </a>
                <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                    <li><a class="dropdown-item" href="#">Profile</a></li>
                    <li><a class="dropdown-item" href="#">Settings</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="{% url 'logout' %}">Sign out</a></li>
                </ul>
            </div>
        </div>

        <!-- Main Content Area -->
        <main class="flex-grow-1 p-4 overflow-auto">
            
            <!-- Django Block: This is where your other templates will show up -->
            {% block content %}
            
            {% endblock %}
            
        </main>
        
    </div>

    {% if request.session.is_admin %}
    
    <!-- Floating Chat Button (Bottom Right) -->
    <button id="chatbot-toggle-btn" class="btn btn-primary rounded-circle shadow-lg position-fixed bottom-0 end-0 m-4 d-flex justify-content-center align-items-center" style="width: 60px; height: 60px; z-index: 1050;">
        <i class="bi bi-chat-dots-fill fs-3"></i>
    </button>

    <!-- Chat Popup Window (Hidden by default) -->
    <div id="chatbot-popup" class="card shadow-lg position-fixed bottom-0 end-0 m-4 d-none" style="width: 350px; z-index: 1049; border-radius: 15px; overflow: hidden; margin-bottom: 90px !important;">
        <!-- Header -->
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-2">
            <span class="fw-bold"><i class="bi bi-robot me-2"></i> Admin Bot</span>
            <button type="button" class="btn-close btn-close-white" id="chatbot-close-btn" aria-label="Close"></button>
        </div>
        
        <!-- Chat History -->
        <div class="card-body" id="chat-window" style="height: 320px; overflow-y: auto; background-color: #f8f9fa;">
            <div class="mb-2 text-start">
                <span class="badge bg-secondary p-2 fs-6 text-wrap text-start fw-normal">Bot: Hello Admin. Add, remove, or update users here!</span>
            </div>
        </div>
        
        <!-- Input Form -->
        <div class="card-footer bg-white p-2">
            <form id="chat-form" class="d-flex">
                <input type="text" id="chat-input" class="form-control form-control-sm me-2" placeholder="Type a command..." required autocomplete="off">
                <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-send-fill"></i></button>
            </form>
        </div>
    </div>

    <!-- Chat Interaction Script -->
    <script>
        const chatToggleBtn = document.getElementById('chatbot-toggle-btn');
        const chatCloseBtn = document.getElementById('chatbot-close-btn');
        const chatPopup = document.getElementById('chatbot-popup');
        const chatInput = document.getElementById('chat-input');
        
        // Open/Close chat window
        chatToggleBtn.addEventListener('click', () => {
            chatPopup.classList.toggle('d-none');
            if(!chatPopup.classList.contains('d-none')){
                chatInput.focus();
            }
        });

        // Close button inside header
        chatCloseBtn.addEventListener('click', () => {
            chatPopup.classList.add('d-none');
        });

        // Handle sending messages
        document.getElementById('chat-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const message = chatInput.value;
            const chatWindow = document.getElementById('chat-window');
            
            // 1. Show Admin's message on the right
            chatWindow.innerHTML += `
                <div class="mb-2 text-end">
                    <span class="badge bg-primary p-2 fs-6 text-wrap text-start fw-normal">${message}</span>
                </div>`;
            chatInput.value = '';
            chatWindow.scrollTop = chatWindow.scrollHeight;

           // 2. Send to Django backend API
        fetch('/chat_api/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams({ 'message': message })
        })
        .then(response => response.json())
        .then(data => {
            // 3. Show Bot's response on the left
            chatWindow.innerHTML += `
                <div class="mb-2 text-start">
                    <span class="badge bg-secondary p-2 fs-6 text-wrap text-start fw-normal">Bot: ${data.reply}</span>
                </div>`;
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // 4. BEST SOLUTION: Agar command successful thi, toh background mein table update karein
            if (data.reply.includes("Success!")) {
                
                // Current page (e.g., home) ko background mein dobara fetch karein
                fetch(window.location.href)
                .then(res => res.text())
                .then(html => {
                    // Naye HTML message se sirf table nikal kar purane table ki jagah laga dein
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    
                    // Aapke home.html mein .table-responsive class maujood hai
                    const newTable = doc.querySelector('.table-responsive').innerHTML;
                    const currentTable = document.querySelector('.table-responsive');
                    
                    if (currentTable) {
                        currentTable.innerHTML = newTable;
                        
                        // Optional: Table update hone par ek chota sa highlight effect dena
                        currentTable.style.opacity = '0.5';
                        setTimeout(() => { currentTable.style.opacity = '1'; }, 300);
                    }
                });
            }
        })
        .catch(error => {
            chatWindow.innerHTML += `
                <div class="mb-2 text-start">
                    <span class="badge bg-danger p-2 fs-6 text-wrap text-start fw-normal">Bot: Error connecting to server.</span>
                </div>`;
        });
        });
    </script>
    
    {% endif %}

    <!-- Bootstrap 5 JS Bundle (Required for dropdowns to work) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
